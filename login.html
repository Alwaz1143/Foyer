<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to Foyer — your personal browser homepage">
    <title>Foyer — Sign In</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=eIM3rBvyFbHA&format=png&color=000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/auth.css">
    <!-- App config — must load before any Firebase/module scripts -->
    <script src="config.js"></script>
</head>
<body>

    <!-- Animated background -->
    <div class="auth-bg">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon-wrap">🚪</div>
                <h1 class="logo-name">Foyer</h1>
            </div>
            <p class="auth-tagline">Your personal browser homepage</p>

            <!-- Mode Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabSignIn" type="button">Sign In</button>
                <button class="auth-tab" id="tabSignUp" type="button">Create Account</button>
            </div>

            <!-- Alerts -->
            <div class="auth-alert error" id="authError" style="display: none;"></div>
            <div class="auth-alert success" id="authSuccess" style="display: none;"></div>

            <!-- Google Button -->
            <button class="google-btn" id="googleBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
                    <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <div class="auth-divider"><span>or</span></div>

            <!-- Auth Form -->
            <form id="authForm" novalidate>

                <!-- Display Name (Sign Up only) -->
                <div class="field-group" id="nameGroup" style="display: none;">
                    <label class="field-label" for="nameInput">Display Name</label>
                    <div class="field-wrap">
                        <i class="fas fa-user field-icon"></i>
                        <input type="text" id="nameInput" class="field-input"
                            placeholder="Your name" autocomplete="name">
                    </div>
                </div>

                <!-- Email -->
                <div class="field-group">
                    <label class="field-label" for="emailInput">Email Address</label>
                    <div class="field-wrap">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="emailInput" class="field-input"
                            placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="field-group">
                    <div class="field-label-row">
                        <label class="field-label" for="passwordInput">Password</label>
                        <button type="button" class="forgot-link" id="forgotBtn">Forgot password?</button>
                    </div>
                    <div class="field-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="passwordInput" class="field-input"
                            placeholder="••••••••" autocomplete="current-password" required minlength="6">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitBtnText">Sign In</span>
                    <i class="fas fa-circle-notch fa-spin" id="btnLoader" style="display: none;"></i>
                </button>
            </form>

        </div>

        <p class="auth-footer">
            By signing in you agree to keep your Foyer account safe.
        </p>
    </div>

    <script type="module">
        import {
            auth, db,
            GoogleAuthProvider, signInWithPopup,
            createUserWithEmailAndPassword, signInWithEmailAndPassword,
            onAuthStateChanged, sendPasswordResetEmail, updateProfile,
            doc, setDoc
        } from './firebase-config.js';

        // ── Redirect if already logged in ───────────────────────────
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.replace('index.html');
        });

        // ── State ────────────────────────────────────────────────────
        let isSignUpMode = false;

        // ── Elements ─────────────────────────────────────────────────
        const tabSignIn       = document.getElementById('tabSignIn');
        const tabSignUp       = document.getElementById('tabSignUp');
        const nameGroup       = document.getElementById('nameGroup');
        const forgotBtn       = document.getElementById('forgotBtn');
        const submitBtnText   = document.getElementById('submitBtnText');
        const authError       = document.getElementById('authError');
        const authSuccess     = document.getElementById('authSuccess');
        const btnLoader       = document.getElementById('btnLoader');
        const submitBtn       = document.getElementById('submitBtn');
        const passwordInput   = document.getElementById('passwordInput');
        const togglePassword  = document.getElementById('togglePassword');
        const togglePwIcon    = document.getElementById('togglePasswordIcon');

        // ── Tab switching ─────────────────────────────────────────────
        tabSignIn.addEventListener('click', () => setMode(false));
        tabSignUp.addEventListener('click', () => setMode(true));

        function setMode(signUp) {
            isSignUpMode = signUp;
            tabSignIn.classList.toggle('active', !signUp);
            tabSignUp.classList.toggle('active', signUp);
            nameGroup.style.display          = signUp ? 'block' : 'none';
            forgotBtn.style.display          = signUp ? 'none'  : 'inline';
            submitBtnText.textContent        = signUp ? 'Create Account' : 'Sign In';
            passwordInput.autocomplete       = signUp ? 'new-password' : 'current-password';
            hideAlerts();
        }

        // ── Password visibility toggle ────────────────────────────────
        togglePassword.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type       = isHidden ? 'text' : 'password';
            togglePwIcon.className   = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // ── Google Sign-In ────────────────────────────────────────────
        document.getElementById('googleBtn').addEventListener('click', async () => {
            setLoading(true);
            hideAlerts();
            try {
                const provider = new GoogleAuthProvider();
                const result   = await signInWithPopup(auth, provider);
                await ensureUserDoc(result.user);
                window.location.replace('index.html');
            } catch (err) {
                setLoading(false);
                showError(friendlyError(err.code));
            }
        });

        // ── Email / Password Form ─────────────────────────────────────
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            hideAlerts();

            const email    = document.getElementById('emailInput').value.trim();
            const password = passwordInput.value;
            const name     = document.getElementById('nameInput').value.trim();

            try {
                if (isSignUpMode) {
                    const result = await createUserWithEmailAndPassword(auth, email, password);
                    if (name) await updateProfile(result.user, { displayName: name });
                    await ensureUserDoc(result.user, name);
                } else {
                    const result = await signInWithEmailAndPassword(auth, email, password);
                    await ensureUserDoc(result.user);
                }
                window.location.replace('index.html');
            } catch (err) {
                setLoading(false);
                showError(friendlyError(err.code));
            }
        });

        // ── Forgot Password ───────────────────────────────────────────
        forgotBtn.addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value.trim();
            if (!email) { showError('Enter your email address above first.'); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent — check your inbox.');
            } catch (err) {
                showError(friendlyError(err.code));
            }
        });

        // ── Helpers ───────────────────────────────────────────────────
        async function ensureUserDoc(user, displayName) {
            try {
                await setDoc(doc(db, 'users', user.uid), {
                    email:       user.email       || '',
                    displayName: displayName || user.displayName || '',
                    photoURL:    user.photoURL    || '',
                    createdAt:   new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.warn('Could not write user doc:', e);
            }
        }

        function setLoading(on) {
            submitBtn.disabled = on;
            document.getElementById('googleBtn').disabled = on;
            submitBtnText.style.display = on ? 'none'   : 'inline';
            btnLoader.style.display     = on ? 'inline' : 'none';
        }

        function showError(msg)   { authError.textContent = msg;   authError.style.display = 'block';   authSuccess.style.display = 'none'; }
        function showSuccess(msg) { authSuccess.textContent = msg; authSuccess.style.display = 'block';  authError.style.display = 'none'; }
        function hideAlerts()     { authError.style.display = 'none'; authSuccess.style.display = 'none'; }

        function friendlyError(code) {
            return ({
                'auth/user-not-found':        'No account found with this email.',
                'auth/wrong-password':         'Incorrect password. Try again.',
                'auth/invalid-email':          'Please enter a valid email address.',
                'auth/email-already-in-use':   'An account with this email already exists.',
                'auth/weak-password':          'Password must be at least 6 characters.',
                'auth/too-many-requests':      'Too many attempts. Try again later.',
                'auth/popup-closed-by-user':   'Sign-in was cancelled.',
                'auth/network-request-failed': 'Network error. Check your connection.',
                'auth/invalid-credential':     'Invalid email or password.',
            })[code] || 'Something went wrong. Please try again.';
        }
    </script>
</body>
</html>
