name               = "foyer-unsplash"
main               = "worker.js"
compatibility_date = "2024-09-23"

# Secrets are set via CLI — NOT stored here:
#   wrangler secret put UNSPLASH_CLIENT_ID
#   wrangler secret put UNSPLASH_CLIENT_SECRET
#
# After `wrangler deploy`, your Worker URL will be:
#   https://foyer-unsplash.<your-subdomain>.workers.dev
# Copy that URL into unsplash-callback.html → WORKER_URL constant.
